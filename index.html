<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0a08">
<title>Vaan Magica — Session Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&amp;family=Jost:wght@300;400;500&amp;family=Anuphan:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a08;--bg2:#15100c;--panel:#17120d;
  --ivory:#f2ebdf;--text:#e9e0d1;--muted:#a3937d;--dim:#6f6252;
  --gold:#c9a86a;--gold-l:#e6cf9d;--amber:#d98b3a;
  --line:rgba(201,168,106,.18);--line2:rgba(201,168,106,.42);
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
  --sans:'Jost','Anuphan',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);background-color:var(--bg);
  background-image:radial-gradient(1200px 520px at 50% -18%,rgba(201,140,60,.16),rgba(201,140,60,0) 70%);
  background-repeat:no-repeat;font-family:var(--sans);font-weight:400;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.vignette{display:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
#root{position:relative;z-index:1}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px 64px}
.wrap.wide{max-width:1440px}
button,input,select{font:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
::selection{background:rgba(201,168,106,.35)}

/* ---------- masthead ---------- */
.head{text-align:center;padding:46px 0 34px;border-bottom:1px solid var(--line);margin-bottom:30px;animation:fade 1.2s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.eyebrow{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);padding-left:.42em}
h1{margin:14px 0 10px;font-family:var(--serif);font-weight:400;font-size:clamp(40px,8.4vw,92px);line-height:.95;letter-spacing:.14em;padding-left:.14em;
  text-transform:uppercase;color:transparent;
  background:linear-gradient(180deg,#f7ecd2 0%,#e6cf9d 42%,#c9a86a 70%,#a87b3f 100%);-webkit-background-clip:text;background-clip:text}
.sub{margin:0;font-family:var(--serif);font-style:italic;font-size:clamp(15px,2vw,18px);color:var(--muted);letter-spacing:.02em}
.sub .th{display:block;margin-top:6px;font-family:var(--sans);font-style:normal;font-weight:300;font-size:13px;color:var(--dim)}
.free-strip{display:inline-flex;align-items:baseline;gap:10px;margin-top:22px;font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-l)}
.free-strip b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:0;color:var(--ivory)}
.free-strip::before,.free-strip::after{content:'';width:34px;height:1px;background:var(--line2);align-self:center}

/* ---------- owner banner ---------- */
.owner-banner{display:flex;align-items:center;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;margin:0 0 26px;padding:12px 0;
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-l)}
.ob-t{display:flex;align-items:center;gap:10px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
.ob-acts{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.switch input{appearance:none;-webkit-appearance:none;width:30px;height:16px;border-radius:999px;border:1px solid var(--line2);background:transparent;position:relative;cursor:pointer;margin:0;flex:none;transition:background .3s}
.switch input::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .3s,background .3s}
.switch input:checked{background:rgba(201,168,106,.25)}
.switch input:checked::after{transform:translateX(14px);background:var(--gold-l)}

/* ---------- buttons: text-led ---------- */
.btn{position:relative;color:var(--text);background:transparent;border:1px solid var(--line2);border-radius:0;padding:9px 20px;cursor:pointer;
  font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;transition:background .3s,color .3s,border-color .3s}
.btn:hover{background:var(--ivory);color:#14100b;border-color:var(--ivory)}
.btn.icon{width:40px;height:40px;padding:0;font-size:16px;letter-spacing:0;border-color:transparent;font-family:var(--serif)}
.btn.icon:hover{background:transparent;color:var(--gold-l);border-color:transparent}
.btn.primary{background:var(--ivory);color:#14100b;border-color:var(--ivory)}
.btn.primary:hover{background:var(--gold-l);border-color:var(--gold-l)}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:transparent;color:#d9a08a;padding-left:0;padding-right:0}
.btn.danger:hover{background:transparent;color:#f0b9a3;text-decoration:underline;text-underline-offset:4px}
.btn:disabled{opacity:.35;cursor:default;background:transparent;color:var(--text);border-color:var(--line)}
.btn.primary:disabled{background:var(--ivory);color:#14100b}
.owner-banner .btn{padding:7px 14px;font-size:10.5px}

/* ---------- toolbar ---------- */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin-bottom:18px}
.nav{display:flex;align-items:center;gap:2px}
.mtitle{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(30px,4.6vw,46px);line-height:1;color:var(--ivory);min-width:0;text-align:left;padding:0 6px}
.mtitle .ce{font-family:var(--sans);font-style:normal;font-size:12px;letter-spacing:.3em;color:var(--gold);margin-left:12px;vertical-align:middle}
.bar>.btn{justify-self:center}
.legend{justify-self:end;display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:flex-end;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:14px;height:2px;background:var(--c)}
.legend .lf i{--c:var(--gold-l);height:1px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:34px;align-items:start}
.layout.with-aside{grid-template-columns:minmax(0,1fr) 300px}

/* ---------- calendar: editorial hairline grid ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.wd{text-align:left;padding:10px 12px;font-size:10.5px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.blank{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal.in-left,.cal.in-right,.cal.in-fade{animation:fade .7s ease both}
.day{position:relative;display:flex;flex-direction:column;gap:8px;min-height:150px;padding:12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .4s}
.day.has{background:rgba(201,168,106,.025)}
.day.past{opacity:.38}
.day.editable{cursor:pointer}
.day.editable:hover{background:rgba(242,235,223,.05)}
.dnum{display:flex;align-items:baseline;gap:8px}
.dnum .n{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1;color:var(--ivory)}
.day.today .dnum .n{color:var(--gold-l);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.day.today::after{content:'Today';position:absolute;top:15px;right:12px;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
.day.today .cnt{display:none}
.dwd{display:none;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.cnt{margin-left:auto;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.free-tag{margin-top:auto;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--gold-l);opacity:.9}
.past-tag{display:none}

/* ---------- session entries ---------- */
.t-camp{--c:#d9783a}
.t-mini{--c:#d6b06a}
.t-os{--c:#efe6d4}
.t-block{--c:#5f554b}
.sess{position:relative;padding:1px 0 1px 10px;border-left:2px solid var(--c);font-size:12px;color:var(--text)}
.s-top{display:flex;align-items:baseline;justify-content:space-between;gap:2px 8px;flex-wrap:wrap}
.s-time{font-variant-numeric:tabular-nums;font-size:11.5px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.badge{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--c);white-space:nowrap}
.t-block .badge{color:var(--muted)}
.s-title{margin-top:2px;font-size:12.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ivory);overflow-wrap:anywhere;line-height:1.35}
.s-ss{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:0;font-size:14px;color:var(--gold-l);margin-left:6px;white-space:nowrap}
.s-pl{margin-top:2px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.s-note{margin-top:2px;font-family:var(--serif);font-style:italic;font-size:12px;color:var(--muted);overflow-wrap:anywhere}

/* ---------- summary ---------- */
.summary{position:sticky;top:20px;padding:22px 0 0;border-top:1px solid var(--gold)}
.summary h3{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:30px;line-height:1.05;color:var(--ivory)}
.sm-sub{margin:6px 0 20px;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
.tiles{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.tile{padding:14px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile .v{font-family:var(--serif);font-size:36px;line-height:1;color:var(--gold-l);font-variant-numeric:lining-nums tabular-nums}
.tile .k{margin-top:6px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sm-h{margin:26px 0 10px;font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.next{padding:2px 0 2px 12px;border-left:2px solid var(--c)}
.next .nd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.next .nt{margin-top:3px;font-family:var(--serif);font-size:21px;line-height:1.2;color:var(--ivory);overflow-wrap:anywhere}
.tbar{display:grid;grid-template-columns:92px 1fr 22px;align-items:center;gap:10px;margin:9px 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text)}
.tbar .track{height:1px;background:var(--line)}
.tbar .fill{height:1px;background:var(--c);transform-origin:left;position:relative;top:0;box-shadow:0 0 0 .5px var(--c)}
.summary.anim .tbar .fill{animation:grow 1.2s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.tbar .num{text-align:right;font-family:var(--serif);font-size:16px;letter-spacing:0;color:var(--ivory)}
.camp{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.camp:first-of-type{border-top:0}
.camp .cd{width:10px;height:2px;background:var(--c);flex:none;align-self:center}
.camp .cm{flex:1;min-width:0}
.camp .nm{font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ivory);overflow-wrap:anywhere}
.camp .ss{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted)}
.camp .cc{text-align:right;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.camp .cc b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:0;line-height:1;color:var(--gold-l)}
.sm-empty{font-family:var(--serif);font-style:italic;color:var(--muted);padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px 12px}
.chip{font-size:11.5px;letter-spacing:.04em;color:var(--text);border-bottom:1px solid var(--line2);padding-bottom:1px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,6,4,.78);animation:ovIn .35s ease both}
@keyframes ovIn{from{opacity:0}}
.modal{width:min(640px,100%);max-height:92vh;overflow:auto;padding:30px 30px 26px;background:var(--panel);border:1px solid var(--line2);color:var(--text);animation:fade .45s ease both}
.modal.sm{width:min(400px,100%)}
.modal h2{margin:0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:34px;line-height:1.05;color:var(--ivory)}
.msub{margin:8px 0 6px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.ed{position:relative;margin-top:16px;padding:16px 0 4px 16px;border-left:2px solid var(--c);border-top:1px solid var(--line)}
.ed-head{display:flex;gap:10px;align-items:center}
.seg4{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line2)}
.seg4 button{font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:transparent;border:0;border-left:1px solid var(--line);padding:9px 2px;cursor:pointer;transition:background .3s,color .3s}
.seg4 button:first-child{border-left:0}
.seg4 button:hover{color:var(--ivory)}
.seg4 button.on{background:var(--ivory);color:#14100b}
.x{flex:none;width:34px;height:34px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;transition:color .3s,border-color .3s}
.x:hover{color:var(--ivory);border-color:var(--line2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.row.time{grid-template-columns:1fr 1fr auto;align-items:end}
.row.camp-row{grid-template-columns:minmax(0,1fr) 110px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:9.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.f input{font-size:15px;letter-spacing:.01em;text-transform:none;font-weight:400;color:var(--ivory);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:6px 0 7px;width:100%;min-width:0;transition:border-color .3s}
.f input:focus{border-bottom-color:var(--gold-l);outline:none}
.f input::placeholder{color:var(--dim);letter-spacing:.01em}
.tsel{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;letter-spacing:0}
.tsel select{flex:1;min-width:0;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ivory);background:var(--panel);border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:6px 0 7px;cursor:pointer}
.tsel select:focus{border-bottom-color:var(--gold-l);outline:none}
.f.full{margin-top:14px}
.dur{padding:0 0 9px;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--gold-l);white-space:nowrap}
.presets{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.presets button{font-size:10.5px;letter-spacing:.12em;color:var(--muted);background:transparent;border:0;padding:2px 0;cursor:pointer;border-bottom:1px solid transparent;transition:color .3s,border-color .3s}
.presets button:hover{color:var(--ivory);border-bottom-color:var(--gold)}
.hint{margin-top:8px;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--gold-l)}
.ed .chips{margin-top:8px}
.f .chip{text-transform:none;letter-spacing:.04em;font-weight:400}
.ed-empty{margin-top:20px;padding:26px 0;text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--gold-l);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.adds{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.warn{margin-top:14px;font-size:12.5px}
.warn.soft{color:var(--gold-l)}
.warn.err{color:#e4a48b}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.actions .r{display:flex;gap:10px;margin-left:auto}

/* ---------- misc ---------- */
.notice{padding:80px 16px;text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted)}
.notice .btn{margin-top:16px}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);text-align:left}
.credit{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pin{width:100%;margin-top:22px;padding:8px 0;font-family:var(--serif);font-size:30px;text-align:center;letter-spacing:.5em;color:var(--ivory);background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0}
.pin:focus{border-bottom-color:var(--gold-l);outline:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);padding:12px 22px;
  background:var(--ivory);color:#14100b;font-size:12px;letter-spacing:.08em;animation:toastIn .45s ease both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}}

@media (max-width:1080px){
  .layout.with-aside{grid-template-columns:minmax(0,1fr)}
  .summary{position:static;order:-1}
}
@media (max-width:760px){
  .head{padding:34px 0 26px;margin-bottom:22px}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
  .nav{flex:1 1 auto;margin-left:-10px}
  .bar>.btn{margin-left:auto;padding:8px 14px}
  .legend{flex:1 1 100%;justify-content:flex-start}
  .wd,.blank{display:none}
  .cal{grid-template-columns:minmax(0,1fr)}
  .day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:6px 14px;padding:14px 12px}
  .dnum{flex:0 0 74px;flex-direction:column;align-items:flex-start;gap:4px}
  .dwd{display:block}
  .cnt{display:none}
  .day>.sess,.day>.free-tag{flex:1 1 calc(100% - 92px);min-width:0}
  .day>.sess~.sess{margin-left:88px}
  .free-tag{margin-top:2px}
  .day.today::after{display:none}
  .day.today .dwd::after{content:' · Today';color:var(--gold)}
  .day.past:not(.has){display:none}
}
@media (max-width:520px){
  .seg4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg4 button:nth-child(3){border-left:0}
  .seg4 button:nth-child(n+3){border-top:1px solid var(--line)}
  .row.time{grid-template-columns:1fr 1fr}
  .row.time .dur{grid-column:1/-1;padding:0}
  .row.camp-row{grid-template-columns:minmax(0,1fr) 84px}
  .modal{padding:22px 18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div id="root"></div>
<script>
(function(){
  'use strict';
  var API='/api/schedule';
  var TYPES=[
    {k:'campaign',label:'Campaign',short:'Campaign',cls:'t-camp'},
    {k:'mini',label:'Mini-series',short:'Mini',cls:'t-mini'},
    {k:'oneshot',label:'One-shot',short:'One-shot',cls:'t-os'},
    {k:'block',label:'Unavailable',short:'Closed',cls:'t-block'}
  ];
  var TYPE={};TYPES.forEach(function(t){TYPE[t.k]=t;});
  var PRESETS=[['Morning','09:00','12:00'],['Afternoon','13:00','17:00'],['Evening','17:00','20:00'],['Night','19:00','23:00'],['Late','20:00','00:00']];
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MSHORT=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var WDFULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var TIME_RE=/^([01]\d|2[0-3]):[0-5]\d$/;
  var reduceMotion=false;
  try{reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

  /* ---------- ember / spark FX ---------- */
  // Quiet gold dust: a handful of slow, faint specks. No pointer trail.
  var FX=(function(){
    var noop={burst:function(){}};
    var cv=document.getElementById('fx');
    if(!cv||!cv.getContext||reduceMotion){return noop;}
    var ctx=null;
    try{ctx=cv.getContext('2d');}catch(e){ctx=null;}
    if(!ctx){return noop;}
    var W=0,H=0,dpr=1,parts=[],raf=0,target=10;
    function size(){
      dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
      cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
      cv.style.width=W+'px';cv.style.height=H+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      target=Math.round(Math.min(16,Math.max(6,W*H/90000)));
    }
    function dust(initial){
      return {x:Math.random()*W,y:initial?Math.random()*H:H+6,vx:(Math.random()-.5)*.06,vy:-(.06+Math.random()*.14),
        r:.5+Math.random()*.9,t:0,life:1400+Math.random()*1400,ph:Math.random()*6.28,burst:false};
    }
    function speck(x,y){
      var a=Math.random()*6.283,v=.4+Math.random()*1.6;
      return {x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.3,r:.5+Math.random()*.9,t:0,life:50+Math.random()*50,ph:0,burst:true};
    }
    function step(){
      raf=requestAnimationFrame(step);
      ctx.clearRect(0,0,W,H);
      var n=0;
      for(var i=parts.length-1;i>=0;i--){
        var p=parts[i];p.t++;
        var k=p.t/p.life;
        if(k>=1||p.y<-10){parts.splice(i,1);continue;}
        if(p.burst){p.vx*=.96;p.vy=p.vy*.96+.01;}else{n++;}
        p.x+=p.vx;p.y+=p.vy;
        var a=p.burst?(1-k)*.9:Math.sin(Math.PI*k)*(.35+.25*Math.sin(p.t/60+p.ph));
        ctx.fillStyle='rgba(230,207,157,'+a+')';
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
      }
      if(n<target&&Math.random()<.05){parts.push(dust(false));}
    }
    function start(){if(!raf){raf=requestAnimationFrame(step);}}
    function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
    size();
    for(var i=0;i<target;i++){var d=dust(true);d.t=Math.random()*d.life*.6;parts.push(d);}
    window.addEventListener('resize',size);
    document.addEventListener('visibilitychange',function(){if(document.hidden){stop();}else{start();}});
    start();
    return {burst:function(x,y,n){for(var i=0;i<Math.min(n||18,18);i++){parts.push(speck(x,y));}start();}};
  })();

  function toMin(t){var p=String(t).split(':');return Number(p[0])*60+Number(p[1]);}
  function dur(s){var a=toMin(s.start),b=toMin(s.end);if(b<=a){b+=1440;}return b-a;}
  function fmtDur(m){var h=Math.floor(m/60),mm=m%60;return (h?h+'h':'')+(mm?(h?' ':'')+mm+'m':'');}
  function fmtHours(min){var h=Math.round(min/6)/10;return h;}
  function ssLabel(ss){ss=String(ss||'').trim();if(!ss){return '';}return /^\d+$/.test(ss)?'SS'+ss:ss;}
  function nextSS(ss){
    var m=String(ss||'').trim().match(/^(.*?)(\d+)$/);
    if(!m){return '';}
    var n=String(Number(m[2])+1);
    while(n.length<m[2].length){n='0'+n;}
    return m[1]+n;

  function parsePlayers(str){
    var seen={},out=[];
    String(str||'').split(/[\s,]+/).forEach(function(p){
      p=p.trim();
      if(!p){return;}
      if(p.charAt(0)!=='@'){p='@'+p;}
      if(p==='@'){return;}
      p=p.slice(0,40);
      var k=p.toLowerCase();
      if(seen[k]){return;}
      seen[k]=1;out.push(p);
    });
    return out.slice(0,12);
  }

  function countUp(node,val,decimals,animate){
    function fmt(v){return decimals?v.toFixed(decimals):String(Math.round(v));}
    if(!animate||reduceMotion||!window.requestAnimationFrame||!val){node.textContent=fmt(val);return;}
    var t0=null,d=800;
    function f(t){
      if(t0===null){t0=t;}
      var k=Math.min(1,(t-t0)/d);k=1-Math.pow(1-k,3);
      node.textContent=fmt(val*k);
      if(k<1){requestAnimationFrame(f);}
    }
    node.textContent=fmt(0);
    requestAnimationFrame(f);
  }

        data=r.body;
      }else{

        data=await g.json();

  /* ---------- admin summary ---------- */
  function monthStats(y,m){
    var total=new Date(y,m+1,0).getDate();
    var st={count:0,minutes:0,types:{campaign:0,mini:0,oneshot:0},camps:{},players:{},activeDays:0,freeAhead:0};
    for(var d=1;d<=total;d++){
      var dk=key(y,m,d);
      var list=sortList(state.days[dk]);
      var real=list.filter(function(s){return s.type!=='block';});
      if(real.length){st.activeDays++;}
      if(!list.length&&dk>=todayKey){st.freeAhead++;}
      real.forEach(function(s){
        var mins=dur(s);
        st.count++;st.minutes+=mins;
        st.types[s.type]=(st.types[s.type]||0)+1;
        var name=s.campaign||typeOf(s).label;
        var ck=name.toLowerCase();
        var c=st.camps[ck]||(st.camps[ck]={name:name,type:s.type,count:0,minutes:0,ss:[]});
        c.count++;c.minutes+=mins;c.type=s.type;
        if(s.ss){c.ss.push(ssLabel(s.ss));}
        (s.players||[]).forEach(function(p){st.players[p.toLowerCase()]=p;});
      });
    }
    return st;
  }
  function nextSession(){
    var keys=Object.keys(state.days).filter(function(k){return k>=todayKey;}).sort();
    for(var i=0;i<keys.length;i++){
      var list=sortList(state.days[keys[i]]);
      for(var j=0;j<list.length;j++){
        var s=list[j];
        if(s.type==='block'){continue;}
        if(keys[i]===todayKey&&toMin(s.start)+dur(s)<=nowMin){continue;}
        return {dk:keys[i],s:s};
      }
    }
    return null;
  }

        var r=await api({pin:input.value,action:'load'});
        if(r.status===200){
          pin=input.value;
          try{sessionStorage.setItem('pin',pin);}catch(e){}
          isOwner=true;applyData(r.body);loaded=true;loadError=false;
          close();animateNext='fade';render();
          FX.burst(window.innerWidth/2,Math.min(220,window.innerHeight/3),70);
          return;
        }else if(r.status===401){
          toast('รหัสไม่ถูกต้อง');input.value='';
        }else if(r.status===429){
          toast('ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่');
        }else{
          toast('ระบบยังไม่พร้อม ตรวจสอบการตั้งค่าบนเซิร์ฟเวอร์');
        }
      }catch(e){
        toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง');
      }
      busy=false;ok.disabled=false;cancel.disabled=false;input.focus();
    }
    right.appendChild(cancel);right.appendChild(ok);
    actions.appendChild(right);
    md.appendChild(actions);
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit();}});
    ov.addEventListener('click',function(e){if(e.target===ov){close();}});
    document.addEventListener('keydown',onKey);
    document.body.appendChild(ov);
    setTimeout(function(){input.focus();},0);
  }

  /* ---------- day editor ---------- */
  function campaignNames(){
    var count={},label={};
    Object.keys(state.days).forEach(function(dk){
      state.days[dk].forEach(function(s){
        if(!s.campaign||s.type==='block'){return;}
        var k=s.campaign.toLowerCase();
        count[k]=(count[k]||0)+1;label[k]=s.campaign;
      });
    });
    return Object.keys(count).sort(function(a,b){return count[b]-count[a];}).map(function(k){return label[k];}).slice(0,40);
  }
  function findLast(name,dk){
    var want=String(name||'').trim().toLowerCase();
    if(!want){return null;}
    var best=null,bestKey='';
    Object.keys(state.days).forEach(function(k){
      if(k>=dk){return;}
      sortList(state.days[k]).forEach(function(s){
        if(s.type==='block'||String(s.campaign||'').toLowerCase()!==want){return;}
        if(k>=bestKey){best=s;bestKey=k;}
      });
    });
    return best;
  }

  function openEditor(dk,y,m,d,wd){
    modalOpen=true;
    var draft=sortList(state.days[dk]).map(function(s){
      return {id:s.id||newId(),start:s.start,end:s.end,type:TYPE[s.type]?s.type:'campaign',ss:s.ss||'',campaign:s.campaign||'',
        players:(s.players||[]).slice(),note:s.note||''};
    });

    var ov=el('div','ov');
    var md=el('div','modal');
    md.setAttribute('role','dialog');md.setAttribute('aria-modal','true');
    md.setAttribute('aria-label','ลงคิววันที่ '+d+' '+MONTHS[m]);
    ov.appendChild(md);
    md.appendChild(el('h2','',d+' '+MONTHS[m]+' '+y));
    md.appendChild(el('div','msub',WDFULL[wd]+' · empty days show as Available'));

    var dl=document.createElement('datalist');
    dl.id='camp-list';
    campaignNames().forEach(function(n){var o=document.createElement('option');o.value=n;dl.appendChild(o);});
    md.appendChild(dl);

    var listBox=el('div','ed-list');
    md.appendChild(listBox);

    var adds=el('div','adds');
    adds.appendChild(btn('+ Session','',function(){addSession('campaign');}));
    adds.appendChild(btn('+ Close time','ghost',function(){addSession('block');}));
    md.appendChild(adds);

    var warn=el('div','warn');
    warn.setAttribute('role','status');
    md.appendChild(warn);

    var actions=el('div','actions');
    var clearBtn=btn('Clear day','danger',function(){draft.length=0;renderList();});
    var right=el('div','r');
    var cancel=btn('Cancel','',close);
    var save=btn('Save','primary',doSave);
    right.appendChild(cancel);right.appendChild(save);
    actions.appendChild(clearBtn);actions.appendChild(right);
    md.appendChild(actions);

    function addSession(type){
      var last=draft.length?draft[draft.length-1]:null;
      var s={id:newId(),start:'19:00',end:'23:00',type:type,ss:'',campaign:'',players:[],note:''};
      if(type==='block'){s.start='09:00';s.end='18:00';}
      else if(last&&TIME_RE.test(last.end)&&toMin(last.end)>toMin(last.start)&&toMin(last.end)<=1260){
        s.start=last.end;
        var e=toMin(last.end)+180;
        s.end=e>=1440?'00:00':pad(Math.floor(e/60))+':'+pad(e%60);
      }
      draft.push(s);
      renderList();
      var cards=listBox.querySelectorAll('.ed');
      var lastCard=cards[cards.length-1];
      if(lastCard){
        var f=lastCard.querySelector(type==='block'?'.f-start select':'.f-camp input');
        if(f){f.focus();}
        if(lastCard.scrollIntoView){lastCard.scrollIntoView({block:'nearest',behavior:reduceMotion?'auto':'smooth'});}
      }
    }

    function field(label,cls,type,value,placeholder){
      var w=el('label','f '+(cls||''));
      w.appendChild(el('span','',label));
      var i=document.createElement('input');
      i.type=type;i.value=value||'';
      if(placeholder){i.placeholder=placeholder;}
      w.appendChild(i);
      return {wrap:w,input:i};
    }

    function timeField(label,cls,value,onChange){
      var w=el('label','f '+cls);
      w.appendChild(el('span','',label));
      var box=el('div','tsel');
      var p=TIME_RE.test(value)?value.split(':'):['19','00'];
      var hs=document.createElement('select'),ms=document.createElement('select');
      hs.setAttribute('aria-label',label+' (ชั่วโมง)');ms.setAttribute('aria-label',label+' (นาที)');
      for(var h=0;h<24;h++){var o=document.createElement('option');o.value=pad(h);o.textContent=pad(h);hs.appendChild(o);}
      var mins=[];for(var mm=0;mm<60;mm+=5){mins.push(pad(mm));}
      if(mins.indexOf(p[1])<0){mins.push(p[1]);mins.sort();}
      mins.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;ms.appendChild(o);});
      hs.value=p[0];ms.value=p[1];
      function ch(){onChange(hs.value+':'+ms.value);}
      hs.addEventListener('change',ch);ms.addEventListener('change',ch);
      box.appendChild(hs);box.appendChild(document.createTextNode(':'));box.appendChild(ms);
      w.appendChild(box);
      return {wrap:w,set:function(v){var q=v.split(':');if(!ms.querySelector('option[value="'+q[1]+'"]')){var o=document.createElement('option');o.value=q[1];o.textContent=q[1];ms.appendChild(o);}hs.value=q[0];ms.value=q[1];}};
    }

    function card(s){
      var t=typeOf(s);
      var c=el('div','ed '+t.cls);
      var head=el('div','ed-head');
      var seg=el('div','seg4');
      seg.setAttribute('role','group');seg.setAttribute('aria-label','ประเภทคิว');
      TYPES.forEach(function(tt){
        var b=el('button',tt.k===s.type?'on':'',tt.label);
        b.type='button';b.setAttribute('aria-pressed',String(tt.k===s.type));
        b.addEventListener('click',function(){if(s.type!==tt.k){s.type=tt.k;renderList();}});
        seg.appendChild(b);
      });
      head.appendChild(seg);
      var x=el('button','x','✕');x.type='button';x.setAttribute('aria-label','ลบคิวนี้');
      x.addEventListener('click',function(){draft.splice(draft.indexOf(s),1);renderList();});
      head.appendChild(x);
      c.appendChild(head);

      var tr=el('div','row time');
      var du=el('div','dur');
      function updDur(){du.textContent=(TIME_RE.test(s.start)&&TIME_RE.test(s.end)&&s.start!==s.end)?fmtDur(dur(s))+(toMin(s.end)<=toMin(s.start)?' · overnight':''):'';}
      var fs=timeField('From','f-start',s.start,function(v){s.start=v;updDur();validate();});
      var fe=timeField('To','f-end',s.end,function(v){s.end=v;updDur();validate();});
      tr.appendChild(fs.wrap);tr.appendChild(fe.wrap);tr.appendChild(du);
      c.appendChild(tr);
      updDur();

      var pr=el('div','presets');
      PRESETS.forEach(function(p){
        var b=el('button','',p[0]+' '+p[1]+'–'+p[2]);b.type='button';
        b.addEventListener('click',function(){s.start=p[1];s.end=p[2];fs.set(p[1]);fe.set(p[2]);updDur();validate();});
        pr.appendChild(b);
      });
      c.appendChild(pr);

      if(s.type!=='block'){
        var cr=el('div','row camp-row');
        var fc=field('Campaign','f-camp','text',s.campaign,'e.g. Out of the Abyss');
        fc.input.maxLength=60;fc.input.setAttribute('list','camp-list');
        var fss=field('Session no.','f-ss','text',s.ss,'12');
        fss.input.maxLength=16;
        cr.appendChild(fc.wrap);cr.appendChild(fss.wrap);
        c.appendChild(cr);
        var hint=el('div','hint');
        c.appendChild(hint);

        var fp=field('Players · @discord','f-pl full','text',s.players.join(' '),'@player1 @player2');
        var chips=el('div','chips');
        function renderChips(){chips.textContent='';s.players.forEach(function(p){chips.appendChild(el('span','chip',p));});}
        fp.input.addEventListener('input',function(){s.players=parsePlayers(fp.input.value);renderChips();});
        fp.input.addEventListener('blur',function(){fp.input.value=s.players.join(' ');});
        fp.wrap.appendChild(chips);
        c.appendChild(fp.wrap);
        renderChips();

        fc.input.addEventListener('input',function(){s.campaign=fc.input.value;});
        fss.input.addEventListener('input',function(){s.ss=fss.input.value;});
        fc.input.addEventListener('change',function(){
          var last=findLast(s.campaign,dk);
          if(!last){hint.textContent='';return;}
          if(last.campaign&&last.campaign!==s.campaign){s.campaign=last.campaign;fc.input.value=last.campaign;}
          var filled=[];
          if(!s.ss.trim()&&last.ss){var n=nextSS(last.ss);if(n){s.ss=n;fss.input.value=n;filled.push(ssLabel(n));}}
          if(!s.players.length&&last.players&&last.players.length){s.players=last.players.slice();fp.input.value=s.players.join(' ');renderChips();filled.push('same players');}
          hint.textContent=filled.length?'Filled from the last session: '+filled.join(', '):'';
        });
      }

      var fn=field(s.type==='block'?'Reason · private':'Private note','f-note full','text',s.note,s.type==='block'?'เช่น ทำงาน, ธุระ':'เช่น เตรียมแมพ, เก็บค่าเล่นแล้ว');
      fn.input.maxLength=160;
      fn.input.addEventListener('input',function(){s.note=fn.input.value;});
      c.appendChild(fn.wrap);

      c.querySelectorAll('input').forEach(function(i){
        i.addEventListener('keydown',function(e){if(e.key==='Enter'&&i.getAttribute('list')===null){e.preventDefault();doSave();}});
      });
      return c;
    }

    function renderList(){
      listBox.textContent='';
      if(!draft.length){
        listBox.appendChild(el('div','ed-empty','Open — shown as Available'));
      }
      draft.forEach(function(s){listBox.appendChild(card(s));});
      validate();
    }

    function validate(){
      var err='',overlaps=[];
      draft.forEach(function(s){
        if(err){return;}
        if(!TIME_RE.test(s.start)||!TIME_RE.test(s.end)){err='ใส่เวลาเริ่มและเวลาจบให้ครบทุกคิว';}
        else if(s.start===s.end){err='เวลาเริ่มกับเวลาจบต้องไม่เท่ากัน';}
      });
      if(!err){
        var v=draft.map(function(s){var a=toMin(s.start);return {s:s,a:a,b:a+dur(s)};}).sort(function(p,q){return p.a-q.a;});
        for(var i=0;i<v.length;i++){
          for(var j=i+1;j<v.length;j++){
            if(v[j].a<v[i].b){overlaps.push(v[i].s.start+'–'+v[i].s.end+' กับ '+v[j].s.start+'–'+v[j].s.end);}
          }
        }
      }
      warn.className='warn'+(err?' err':overlaps.length?' soft':'');
      warn.textContent=err||(overlaps.length?'เวลาทับกัน: '+overlaps.join(', ')+' (บันทึกได้ แต่ตรวจดูอีกที)':'');
      save.disabled=!!err;
      clearBtn.disabled=!draft.length;
      return !err;
    }

    function onKey(e){if(e.key==='Escape'&&!busyNow){close();}}
    function close(){
      document.removeEventListener('keydown',onKey);
      ov.remove();
      modalOpen=false;
      render();
    }
    document.addEventListener('keydown',onKey);

    var busyNow=false;
    async function doSave(){
      if(busyNow||!validate()){return;}
      busyNow=true;save.disabled=true;cancel.disabled=true;save.textContent='Saving…';
      var payload=draft.map(function(s){
        return {id:s.id,start:s.start,end:s.end,type:s.type,ss:String(s.ss||'').trim(),campaign:String(s.campaign||'').trim(),
          players:s.type==='block'?[]:s.players,note:String(s.note||'').trim()};
      });
      try{
        var r=await api({pin:pin,action:'save',date:dk,sessions:payload});
        if(r.status===200){
          var saved=Array.isArray(r.body.sessions)?r.body.sessions:payload;
          if(saved.length){state.days[dk]=saved;}else{delete state.days[dk];}
          close();
          var cellEl=root.querySelector('.day[data-date="'+dk+'"]');
          if(cellEl&&cellEl.getBoundingClientRect){
            var rc=cellEl.getBoundingClientRect();
            FX.burst(rc.left+rc.width/2,rc.top+rc.height/2,44);
          }
          toast('Saved · บันทึกแล้ว');
          return;
        }
        if(r.status===401){busyNow=false;close();handleErr(401);return;}
        handleErr(r.status);
      }catch(e){
        toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง');
      }
      busyNow=false;save.disabled=false;cancel.disabled=false;save.textContent='Save';
      validate();
    }

    document.body.appendChild(ov);
    renderList();
    setTimeout(function(){
      var f=md.querySelector('.f-camp input')||md.querySelector('.adds button');
      if(f){f.focus();}
    },0);
  }

  /* ---------- start ---------- */
  render();
  load();
  setInterval(function(){if(!document.hidden&&!modalOpen){load();}},60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!modalOpen&&loaded){load();}});
})();
</script>
</body>
</html>
