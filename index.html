<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2a1208">
<title>ตารางเซสชัน · Vaan Magica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&amp;family=Charm:wght@400;700&amp;family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#140904;--bg2:#21100a;
  --glass:rgba(58,30,12,.52);--glass2:rgba(82,42,14,.62);--glass-hi:rgba(255,196,92,.08);
  --line:rgba(255,190,90,.22);--line2:rgba(255,190,90,.45);
  --gold:#ffc54d;--gold-l:#ffe7a3;--sun:#fff3cf;--amber:#ffa424;--orange:#ff7a1f;--ember:#ff5a1f;
  --text:#fff3e2;--muted:#d6b48f;--dim:#9c7c5c;
  --free:#ffe58a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;color:var(--text);background-color:var(--bg);
  background-image:
    radial-gradient(1100px 600px at 50% -12%,rgba(255,150,40,.42),rgba(255,150,40,0) 62%),
    radial-gradient(700px 500px at 0% 40%,rgba(255,110,30,.16),rgba(255,110,30,0) 65%),
    radial-gradient(800px 600px at 100% 85%,rgba(255,197,77,.14),rgba(255,197,77,0) 62%),
    linear-gradient(180deg,#2a1208 0%,#160904 45%,#120703 100%);
  background-attachment:fixed;background-repeat:no-repeat;
  font-family:'IBM Plex Sans Thai Looped',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.45;overflow-x:hidden;
}
/* slow sweeping light beams */
.vignette{position:fixed;inset:-20%;pointer-events:none;z-index:0;opacity:.55;mix-blend-mode:screen;
  background:
    linear-gradient(105deg,transparent 30%,rgba(255,200,110,.10) 38%,transparent 46%),
    linear-gradient(75deg,transparent 52%,rgba(255,160,60,.08) 58%,transparent 64%),
    linear-gradient(115deg,transparent 64%,rgba(255,230,160,.07) 69%,transparent 74%);
  animation:beams 18s ease-in-out infinite alternate}
@keyframes beams{from{transform:translateX(-6%) skewX(-4deg)}to{transform:translateX(6%) skewX(4deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:2}
#root{position:relative;z-index:1}
.wrap{max-width:1180px;margin:0 auto;padding:30px 16px 56px}
.wrap.wide{max-width:1420px}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
.head{position:relative;text-align:center;margin-bottom:26px;padding:18px 0 4px}
.rays{position:absolute;left:50%;top:58%;width:760px;height:760px;margin:-380px 0 0 -380px;pointer-events:none;opacity:.5;
  background:repeating-conic-gradient(from 0deg,rgba(255,205,110,.22) 0deg 2deg,transparent 2deg 15deg);
  -webkit-mask:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 30%,transparent 72%);mask:radial-gradient(closest-side,#000 0%,rgba(0,0,0,.6) 30%,transparent 72%);
  animation:raysSpin 120s linear infinite}
@keyframes raysSpin{to{transform:rotate(360deg)}}
.eyebrow{position:relative;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(20px,3.4vw,27px);
  letter-spacing:.06em;color:var(--gold-l);text-shadow:0 0 16px rgba(255,197,77,.7)}
.eyebrow::before,.eyebrow::after{content:'';display:inline-block;width:44px;height:1px;vertical-align:middle;margin:0 12px;
  background:linear-gradient(90deg,transparent,var(--gold))}
.eyebrow::after{background:linear-gradient(90deg,var(--gold),transparent)}
h1{position:relative;margin:0 0 6px;font-family:'Charm','IBM Plex Sans Thai Looped',serif;font-weight:700;font-size:clamp(42px,8vw,72px);line-height:1.1;
  background:linear-gradient(100deg,#ff9a2e 0%,#ffcf5a 22%,#fff6d8 40%,#ffd36a 55%,#ff8a24 78%,#ffcf5a 100%);background-size:240% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:liquid 7s ease-in-out infinite;
  filter:drop-shadow(0 0 22px rgba(255,160,40,.55)) drop-shadow(0 2px 0 rgba(120,50,0,.6))}
@keyframes liquid{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.sub{position:relative;margin:0;color:var(--muted);font-size:15px}
.sub .tail{display:inline-block;margin-left:6px;color:var(--gold);animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.35;transform:scale(.7) rotate(45deg)}}
.free-strip{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border-radius:999px;font-size:13.5px;
  color:var(--sun);background:rgba(255,197,77,.1);border:1px solid var(--line2);box-shadow:0 0 18px rgba(255,170,50,.18)}
.free-strip b{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;color:var(--gold-l);line-height:1}

/* ---------- glass + animated gold edge ---------- */
.glass{position:relative;background:var(--glass);border-radius:20px;
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:inset 0 1px 0 rgba(255,230,170,.12),0 20px 60px rgba(0,0,0,.45)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(var(--ang,120deg),rgba(255,210,120,.65),rgba(255,140,40,.12) 30%,rgba(255,210,120,.08) 60%,rgba(255,197,77,.6));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* ---------- owner banner ---------- */
.owner-banner{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin:0 0 16px;padding:11px 16px;
  border-radius:16px;font-size:14px;color:var(--sun);background:linear-gradient(90deg,rgba(255,140,30,.22),rgba(255,197,77,.08));border:1px solid var(--line2);
  box-shadow:0 0 30px rgba(255,140,30,.12)}
.ob-t{display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--gold-l);box-shadow:0 0 6px var(--gold),0 0 14px var(--orange);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.ob-acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:21px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line2);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.switch input::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--dim);transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .2s,box-shadow .2s}
.switch input:checked{background:linear-gradient(90deg,var(--orange),var(--gold))}
.switch input:checked::after{transform:translateX(17px);background:#fff;box-shadow:0 0 10px #fff}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;color:var(--text);background:rgba(255,190,90,.07);border:1px solid var(--line2);border-radius:12px;padding:8px 16px;cursor:pointer;
  transition:background .2s,box-shadow .2s,transform .15s,border-color .2s}
.btn::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,240,200,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover{background:rgba(255,190,90,.14);border-color:var(--gold);box-shadow:0 0 18px rgba(255,180,60,.3);transform:translateY(-1px)}
.btn:hover::after{left:130%}
.btn.icon{width:42px;padding:8px 0;font-size:18px;line-height:1}
.btn.primary{color:#2a1200;font-weight:700;border-color:transparent;background:linear-gradient(135deg,#ffe08a,#ffb33a 45%,#ff7a1f);box-shadow:0 4px 18px rgba(255,140,30,.4)}
.btn.primary:hover{box-shadow:0 6px 26px rgba(255,160,40,.6)}
.btn.ghost{background:transparent}
.btn.danger{color:#ffb39a;background:transparent;border-color:transparent}
.btn.danger:hover{border-color:rgba(255,120,80,.5);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}

/* ---------- toolbar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:8px}
.mtitle{font-family:'Charm','IBM Plex Sans Thai Looped',serif;font-weight:700;font-size:clamp(26px,4.4vw,34px);min-width:220px;text-align:center;line-height:1.2;
  color:var(--gold-l);text-shadow:0 0 20px rgba(255,170,50,.5)}
.mtitle .ce{font-family:'IBM Plex Sans Thai Looped',sans-serif;font-weight:400;font-size:13px;color:var(--dim);margin-left:6px;text-shadow:none}
.legend{display:flex;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.legend .lf i{--c:var(--free)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.layout.with-aside{grid-template-columns:minmax(0,1fr) 310px}
.main{padding:14px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.wd{text-align:center;color:var(--gold);font-size:13px;padding:4px 0 8px;font-weight:600;letter-spacing:.05em;opacity:.85}
.cal.in-left{--dx:30px}.cal.in-right{--dx:-30px}.cal.in-fade{--dx:0px}
.cal.in-left .day,.cal.in-right .day,.cal.in-fade .day{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 13ms)}
@keyframes rise{from{opacity:0;transform:translate(var(--dx),14px);filter:blur(6px) brightness(1.8)}}
.day{position:relative;overflow:hidden;background:rgba(40,20,8,.55);border:1px solid var(--line);border-radius:14px;padding:9px;display:flex;flex-direction:column;gap:6px;min-height:150px;
  transition:transform .25s,box-shadow .25s,border-color .25s,background .25s}
.day::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(170px circle at var(--mx,50%) var(--my,0%),rgba(255,200,100,.22),transparent 65%)}
.day:hover::before{opacity:1}
.day.has{background:rgba(58,28,8,.62);border-color:rgba(255,190,90,.32)}
.day.past{opacity:.42;filter:saturate(.6)}
.day.today{border-color:transparent;background:rgba(80,40,10,.7);box-shadow:0 0 0 1.5px var(--gold),0 0 24px rgba(255,170,50,.35)}
.day.today::after{content:'';position:absolute;inset:-40%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,230,160,.35) 80%,transparent 90%);animation:sweep 6s linear infinite;
  -webkit-mask:radial-gradient(closest-side,transparent 60%,#000 100%);mask:radial-gradient(closest-side,transparent 60%,#000 100%)}
@keyframes sweep{to{transform:rotate(360deg)}}
.day.editable{cursor:pointer}
.day.editable:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 12px 28px rgba(0,0,0,.4),0 0 22px rgba(255,170,50,.28)}
.dnum{position:relative;display:flex;align-items:center;gap:6px;z-index:1}
.dnum .n{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:21px;line-height:1;color:var(--sun)}
.day.today .dnum .n{color:#2a1200;background:radial-gradient(circle at 35% 30%,#fff7d6,#ffc54d 55%,#ff8a24);border-radius:10px;padding:3px 7px;box-shadow:0 0 16px rgba(255,190,70,.8)}
.dwd{display:none;color:var(--muted);font-size:13px}
.cnt{margin-left:auto;font-size:11px;color:#2a1200;background:linear-gradient(90deg,var(--gold-l),var(--gold));border-radius:999px;padding:0 8px;white-space:nowrap;font-weight:600}
.free-tag{position:relative;margin:auto 0;text-align:center;font-weight:600;font-size:13.5px;letter-spacing:.06em;padding:7px 0;border-radius:10px;
  color:var(--free);text-shadow:0 0 10px rgba(255,229,138,.7);background:radial-gradient(ellipse at center,rgba(255,229,138,.12),transparent 70%)}
.free-tag::before,.free-tag::after{content:'✧';font-size:11px;margin:0 6px;color:var(--gold);opacity:.8;animation:twinkle 2.6s ease-in-out infinite}
.free-tag::after{animation-delay:1.3s}
.past-tag{margin:auto 0;text-align:center;color:var(--dim);font-size:13px}

/* ---------- sessions: glowing light-cards ---------- */
.t-camp{--c:#ff5b2e;--c2:#ff9440;--c-ink:#fff1e6}
.t-mini{--c:#ffb020;--c2:#ffd25a;--c-ink:#fff6df}
.t-os{--c:#ff9cb2;--c2:#ffd0dc;--c-ink:#fff0f3}
.t-block{--c:#8c7a6a;--c2:#a8988a;--c-ink:#d9cabd}
.sess{position:relative;z-index:1;border-radius:10px;padding:7px 9px;font-size:12px;color:var(--c-ink);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,transparent),color-mix(in srgb,var(--c) 8%,transparent));
  border:1px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:inset 0 0 14px color-mix(in srgb,var(--c) 18%,transparent);transition:box-shadow .25s}
.t-block.sess{background:repeating-linear-gradient(135deg,rgba(140,122,106,.16) 0 6px,rgba(140,122,106,.06) 6px 12px);box-shadow:none}
.day:hover .sess{box-shadow:inset 0 0 14px color-mix(in srgb,var(--c) 28%,transparent),0 0 14px color-mix(in srgb,var(--c) 35%,transparent)}
.s-top{display:flex;align-items:center;justify-content:space-between;gap:4px 6px;flex-wrap:wrap}
.s-time{font-variant-numeric:tabular-nums;font-weight:600;font-size:12px;white-space:nowrap}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#2a1200;background:linear-gradient(90deg,var(--c),var(--c2));border-radius:999px;padding:1px 7px;white-space:nowrap}
.t-block .badge{color:#1c140e}
.s-title{font-weight:700;font-size:13px;margin-top:3px;overflow-wrap:anywhere;color:#fff}
.s-ss{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:13.5px;color:var(--c2);margin-left:5px;white-space:nowrap;text-shadow:0 0 8px var(--c)}
.s-pl{margin-top:3px;font-size:11px;opacity:.85;overflow-wrap:anywhere}
.s-note{margin-top:3px;font-size:11px;font-style:italic;opacity:.75;overflow-wrap:anywhere}

/* ---------- summary ---------- */
.summary{position:sticky;top:16px;padding:18px 16px;border-radius:20px;background:var(--glass2);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.45),0 0 40px rgba(255,140,30,.1)}
.summary h3{margin:0;font-family:'Charm','IBM Plex Sans Thai Looped',serif;font-size:25px;line-height:1.2;color:var(--gold-l);text-shadow:0 0 14px rgba(255,170,50,.45)}
.sm-sub{color:var(--dim);font-size:12px;margin:2px 0 12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;overflow:hidden;border-radius:14px;padding:11px;background:linear-gradient(160deg,rgba(255,190,90,.14),rgba(255,120,30,.04));border:1px solid var(--line)}
.tile::after{content:'';position:absolute;right:-20px;top:-20px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,120,.25),transparent 70%)}
.tile .v{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#fff6d8,#ffc54d 60%,#ff8a24);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile .k{font-size:12px;color:var(--muted)}
.sm-h{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:var(--gold);margin:18px 0 8px;font-weight:600}
.sm-h::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.next{position:relative;overflow:hidden;border-radius:14px;padding:11px 12px;color:var(--c-ink);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 34%,transparent),color-mix(in srgb,var(--c) 8%,transparent));border:1px solid color-mix(in srgb,var(--c) 60%,transparent)}
.next .nd{font-size:12px;opacity:.9}
.next .nt{font-weight:700;font-size:15px;margin-top:2px;color:#fff;overflow-wrap:anywhere}
.tbar{display:grid;grid-template-columns:86px 1fr 26px;align-items:center;gap:8px;font-size:13px;margin:7px 0}
.tbar .track{height:8px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden}
.tbar .fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),var(--c2));box-shadow:0 0 10px var(--c);transform-origin:left}
.summary.anim .tbar .fill{animation:grow 1s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes grow{from{transform:scaleX(0)}}
.tbar .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--sun)}
.camp{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid rgba(255,190,90,.12)}
.camp:first-of-type{border-top:0}
.camp .cd{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.camp .cm{flex:1;min-width:0}
.camp .nm{font-weight:600;overflow-wrap:anywhere}
.camp .ss{font-size:11.5px;color:var(--dim)}
.camp .cc{text-align:right;font-size:12px;color:var(--dim);white-space:nowrap}
.camp .cc b{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px;color:var(--gold-l);display:block;line-height:1}
.sm-empty{color:var(--dim);font-size:13px;text-align:center;padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;padding:1px 9px;border-radius:999px;background:rgba(255,197,77,.1);border:1px solid var(--line2);color:var(--gold-l)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,6,2,.6);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadeIn .25s ease both}
.modal{position:relative;width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:22px;color:var(--text);
  background:linear-gradient(170deg,rgba(74,36,10,.94),rgba(30,14,5,.96));border:1px solid var(--line2);
  box-shadow:0 0 0 1px rgba(255,220,150,.06),0 30px 80px rgba(0,0,0,.6),0 0 70px rgba(255,140,30,.18);animation:glowIn .4s cubic-bezier(.2,.9,.25,1.1) both}
.modal.sm{width:min(380px,100%)}
@keyframes fadeIn{from{opacity:0}}
@keyframes glowIn{from{opacity:0;transform:translateY(12px) scale(.96);filter:brightness(2) blur(4px)}}
.modal h2{margin:0;font-family:'Charm','IBM Plex Sans Thai Looped',serif;font-size:30px;line-height:1.2;color:var(--gold-l);text-shadow:0 0 16px rgba(255,170,50,.5)}
.msub{color:var(--muted);font-size:14px;margin:2px 0 4px}
.ed{position:relative;border-radius:16px;padding:12px;margin-top:12px;animation:glowIn .3s ease both;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,transparent),rgba(0,0,0,.18));border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ed-head{display:flex;gap:8px;align-items:center}
.seg4{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;background:rgba(0,0,0,.3);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg4 button{font-size:12.5px;color:var(--muted);background:transparent;border:0;border-radius:9px;padding:6px 2px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.seg4 button:hover{color:var(--text)}
.seg4 button.on{color:#2a1200;font-weight:700;background:linear-gradient(135deg,var(--c2),var(--c));box-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.x{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.x:hover{color:#fff;border-color:var(--ember);background:rgba(255,90,31,.25)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.row.time{grid-template-columns:1fr 1fr auto;align-items:end}
.row.camp-row{grid-template-columns:minmax(0,1fr) 110px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.f input{font-size:14px;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
.f input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,77,.18),0 0 16px rgba(255,170,50,.25);outline:none}
.f input::placeholder{color:#7d6249}
.tsel{display:flex;align-items:center;gap:4px;color:var(--muted)}
.tsel select{flex:1;min-width:0;font-size:15px;font-variant-numeric:tabular-nums;color:var(--text);background:#24120a;border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer}
.tsel select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,77,.18);outline:none}
.f.full{margin-top:10px}
.dur{font-size:12.5px;color:var(--gold);padding:0 2px 10px;white-space:nowrap;font-weight:600}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.presets button{font-size:12px;color:var(--muted);background:rgba(255,190,90,.06);border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;transition:all .2s}
.presets button:hover{color:var(--sun);border-color:var(--gold);box-shadow:0 0 10px rgba(255,170,50,.3)}
.hint{font-size:12px;color:var(--gold);margin-top:6px}
.ed .chips{margin-top:6px}
.ed-empty{margin-top:14px;padding:18px;text-align:center;color:var(--free);border:1px dashed var(--line2);border-radius:14px;background:rgba(255,229,138,.05);text-shadow:0 0 10px rgba(255,229,138,.5)}
.adds{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.warn{font-size:13px;margin-top:12px}
.warn.soft{color:var(--gold)}
.warn.err{color:#ff9a7a}
.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .r{display:flex;gap:8px;margin-left:auto}

/* ---------- misc ---------- */
.notice{text-align:center;color:var(--muted);padding:60px 16px}
.notice .btn{margin-top:12px}
.foot{margin-top:30px;text-align:left}
.credit{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:14px;letter-spacing:.06em;color:#8a6a4a;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pin{width:100%;font-size:22px;text-align:center;letter-spacing:.4em;color:var(--sun);background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:12px;padding:10px;margin-top:12px}
.pin:focus{border-color:var(--gold);box-shadow:0 0 18px rgba(255,170,50,.35);outline:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);color:#2a1200;font-weight:600;
  background:linear-gradient(135deg,#ffe8a8,#ffc04a 60%,#ff9a34);padding:10px 18px;border-radius:999px;font-size:14px;
  box-shadow:0 8px 28px rgba(255,140,30,.45);animation:toastIn .35s cubic-bezier(.2,.9,.25,1.25) both}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px) scale(.9)}}

@media (max-width:1060px){
  .layout.with-aside{grid-template-columns:minmax(0,1fr)}
  .summary{position:static;order:-1}
}
@media (max-width:760px){
  .wd,.blank{display:none}
  .cal{grid-template-columns:minmax(0,1fr)}
  .main{padding:10px}
  .day{min-height:0}
  .dwd{display:inline}
  .free-tag,.past-tag{margin:0}
  .day.past:not(.has){display:none}
  .bar{justify-content:center}
  .rays{width:520px;height:520px;margin:-260px 0 0 -260px}
  .eyebrow::before,.eyebrow::after{width:24px;margin:0 8px}
}
@media (max-width:520px){
  .seg4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row.time{grid-template-columns:1fr 1fr}
  .row.time .dur{grid-column:1/-1;padding:0}
  .row.camp-row{grid-template-columns:minmax(0,1fr) 84px}
  .legend{width:100%;justify-content:center}
  .modal{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@property --ang{syntax:'<angle>';inherits:false;initial-value:120deg}
.glass{animation:edge 12s linear infinite}
@keyframes edge{to{--ang:480deg}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div id="root"></div>
<script>
(function(){
  'use strict';
  var API='/api/schedule';
  var TYPES=[
    {k:'campaign',label:'Campaign',short:'Campaign',cls:'t-camp'},
    {k:'mini',label:'Mini-series',short:'Mini',cls:'t-mini'},
    {k:'oneshot',label:'One-shot',short:'One-shot',cls:'t-os'},
    {k:'block',label:'ไม่ว่าง',short:'ไม่ว่าง',cls:'t-block'}
  ];
  var TYPE={};TYPES.forEach(function(t){TYPE[t.k]=t;});
  var PRESETS=[['เช้า','09:00','12:00'],['บ่าย','13:00','17:00'],['เย็น','17:00','20:00'],['ค่ำ','19:00','23:00'],['ดึก','20:00','00:00']];
  var MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var MSHORT=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var WD=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
  var WDFULL=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  var TIME_RE=/^([01]\d|2[0-3]):[0-5]\d$/;
  var reduceMotion=false;
  try{reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

  /* ---------- ember / spark FX ---------- */
  var FX=(function(){
    var noop={burst:function(){}};
    var cv=document.getElementById('fx');
    if(!cv||!cv.getContext||reduceMotion){return noop;}
    var ctx=null;
    try{ctx=cv.getContext('2d');}catch(e){ctx=null;}
    if(!ctx){return noop;}
    var W=0,H=0,dpr=1,parts=[],raf=0,target=22,lastTrail=0;
    var COLS=['255,214,120','255,236,170','255,170,60','255,140,40','255,248,220'];
    function pick(){return COLS[Math.floor(Math.random()*COLS.length)];}
    function size(){
      dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
      cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
      cv.style.width=W+'px';cv.style.height=H+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      target=Math.round(Math.min(46,Math.max(14,W*H/34000)));
    }
    // fireflies: wander slowly, breathe in and out
    function firefly(){
      return {kind:'fly',x:Math.random()*W,y:Math.random()*H,a:Math.random()*6.283,sp:.15+Math.random()*.35,
        r:1.1+Math.random()*1.8,t:0,life:700+Math.random()*900,ph:Math.random()*6.283,col:pick()};
    }
    function spark(x,y,big){
      var a=Math.random()*6.283,v=(big?1.4:.3)+Math.random()*(big?4.4:1.2),star=Math.random()<(big?.55:.4);
      return {kind:'spark',x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(big?1:.2),r:star?(big?3:2)+Math.random()*(big?4:2):.8+Math.random()*1.4,
        t:0,life:(big?45:28)+Math.random()*(big?55:24),col:pick(),star:star,rot:Math.random()*6.283,vr:(Math.random()-.5)*.25};
    }
    function drawStar(p,a){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      var r=p.r,q=r*.26;
      ctx.fillStyle='rgba('+p.col+','+(a*.22)+')';ctx.beginPath();ctx.arc(0,0,r*1.8,0,6.283);ctx.fill();
      ctx.fillStyle='rgba('+p.col+','+a+')';ctx.beginPath();
      ctx.moveTo(0,-r);ctx.quadraticCurveTo(q,-q,r,0);ctx.quadraticCurveTo(q,q,0,r);ctx.quadraticCurveTo(-q,q,-r,0);ctx.quadraticCurveTo(-q,-q,0,-r);
      ctx.fill();ctx.restore();
    }
    function glow(x,y,r,col,a){
      var g=ctx.createRadialGradient(x,y,0,x,y,r*6);
      g.addColorStop(0,'rgba('+col+','+a+')');g.addColorStop(.25,'rgba('+col+','+(a*.35)+')');g.addColorStop(1,'rgba('+col+',0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*6,0,6.283);ctx.fill();
      ctx.fillStyle='rgba(255,252,235,'+Math.min(1,a*1.2)+')';ctx.beginPath();ctx.arc(x,y,r*.7,0,6.283);ctx.fill();
    }
    function step(){
      raf=requestAnimationFrame(step);
      ctx.clearRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      var flies=0;
      for(var i=parts.length-1;i>=0;i--){
        var p=parts[i];p.t++;
        var k=p.t/p.life;
        if(k>=1){parts.splice(i,1);continue;}
        if(p.kind==='fly'){
          flies++;
          p.a+=(Math.random()-.5)*.12;
          p.x+=Math.cos(p.a)*p.sp;p.y+=Math.sin(p.a)*p.sp-.05;
          if(p.x<-20){p.x=W+20;}if(p.x>W+20){p.x=-20;}if(p.y<-20){p.y=H+20;}if(p.y>H+20){p.y=-20;}
          var breathe=.25+.75*Math.pow(Math.max(0,Math.sin(p.t/40+p.ph)),2);
          glow(p.x,p.y,p.r,p.col,Math.sin(Math.PI*k)*breathe*.85);
        }else{
          p.vx*=.95;p.vy=p.vy*.95+.04;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
          var a=1-k;
          if(p.star){drawStar(p,a);}else{glow(p.x,p.y,p.r,p.col,a*.9);}
        }
      }
      ctx.globalCompositeOperation='source-over';
      if(flies<target&&Math.random()<.2){parts.push(firefly());}
    }
    function start(){if(!raf){raf=requestAnimationFrame(step);}}
    function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
    size();
    for(var i=0;i<target*.7;i++){var f=firefly();f.t=Math.random()*f.life*.5;parts.push(f);}
    window.addEventListener('resize',size);
    // golden dust that follows the pointer
    var fine=false;try{fine=window.matchMedia('(pointer: fine)').matches;}catch(e){}
    if(fine){
      window.addEventListener('pointermove',function(e){
        var t=performance.now();
        if(t-lastTrail<34||parts.length>260){return;}
        lastTrail=t;parts.push(spark(e.clientX,e.clientY,false));
      },{passive:true});
    }
    document.addEventListener('visibilitychange',function(){if(document.hidden){stop();}else{start();}});
    start();
    return {burst:function(x,y,n){for(var i=0;i<(n||40);i++){parts.push(spark(x,y,true));}start();}};
  })();

  /* ---------- state ---------- */
  var root=document.getElementById('root');
  var state={days:{},settings:{showPlayers:false}};
  var loaded=false,loadError=false,pin=null,isOwner=false,modalOpen=false,animateNext='fade';
  try{pin=sessionStorage.getItem('pin');}catch(e){}
  if(pin){isOwner=true;}

  var now,todayKey,nowMin;
  function pad(n){return n<10?'0'+n:''+n;}
  function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
  function refreshNow(){now=new Date();todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());nowMin=now.getHours()*60+now.getMinutes();}
  refreshNow();

  var view=null;
  try{view=JSON.parse(sessionStorage.getItem('view'));}catch(e){view=null;}
  if(!view||typeof view.y!=='number'||typeof view.m!=='number'){view={y:now.getFullYear(),m:now.getMonth()};}

  /* ---------- helpers ---------- */
  function el(tag,cls,text){
    var n=document.createElement(tag);
    if(cls){n.className=cls;}
    if(text!==undefined&&text!==null){n.textContent=text;}
    return n;
  }
  function btn(label,cls,fn,aria){
    var b=el('button','btn '+(cls||''),label);
    b.type='button';
    if(aria){b.setAttribute('aria-label',aria);}
    b.addEventListener('click',fn);
    return b;
  }
  var toastTimer=null;
  function toast(msg){
    var old=document.querySelector('.toast');
    if(old){old.remove();}
    var t=el('div','toast',msg);
    t.setAttribute('role','status');
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){t.remove();},3600);
  }
  function toMin(t){var p=String(t).split(':');return Number(p[0])*60+Number(p[1]);}
  function dur(s){var a=toMin(s.start),b=toMin(s.end);if(b<=a){b+=1440;}return b-a;}
  function fmtDur(m){var h=Math.floor(m/60),mm=m%60;return (h?h+' ชม.':'')+(mm?(h?' ':'')+mm+' นาที':'');}
  function fmtHours(min){var h=Math.round(min/6)/10;return h;}
  function ssLabel(ss){ss=String(ss||'').trim();if(!ss){return '';}return /^\d+$/.test(ss)?'SS'+ss:ss;}
  function nextSS(ss){
    var m=String(ss||'').trim().match(/^(.*?)(\d+)$/);
    if(!m){return '';}
    var n=String(Number(m[2])+1);
    while(n.length<m[2].length){n='0'+n;}
    return m[1]+n;
  }
  function parsePlayers(str){
    var seen={},out=[];
    String(str||'').split(/[\s,]+/).forEach(function(p){
      p=p.trim();
      if(!p){return;}
      if(p.charAt(0)!=='@'){p='@'+p;}
      if(p==='@'){return;}
      p=p.slice(0,40);
      var k=p.toLowerCase();
      if(seen[k]){return;}
      seen[k]=1;out.push(p);
    });
    return out.slice(0,12);
  }
  function sortList(l){return (l||[]).slice().sort(function(a,b){return toMin(a.start)-toMin(b.start);});}
  function typeOf(s){return TYPE[s&&s.type]||TYPE.campaign;}
  function newId(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
  function saveView(){try{sessionStorage.setItem('view',JSON.stringify(view));}catch(e){}}
  function go(delta){
    var d=new Date(view.y,view.m+delta,1);
    view={y:d.getFullYear(),m:d.getMonth()};
    animateNext=delta>0?'left':'right';
    saveView();render();
  }
  function goToday(){
    view={y:now.getFullYear(),m:now.getMonth()};
    animateNext='fade';
    saveView();render();
  }
  function countUp(node,val,decimals,animate){
    function fmt(v){return decimals?v.toFixed(decimals):String(Math.round(v));}
    if(!animate||reduceMotion||!window.requestAnimationFrame||!val){node.textContent=fmt(val);return;}
    var t0=null,d=800;
    function f(t){
      if(t0===null){t0=t;}
      var k=Math.min(1,(t-t0)/d);k=1-Math.pow(1-k,3);
      node.textContent=fmt(val*k);
      if(k<1){requestAnimationFrame(f);}
    }
    node.textContent=fmt(0);
    requestAnimationFrame(f);
  }

  /* ---------- server ---------- */
  async function api(body){
    var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var j={};
    try{j=await r.json();}catch(e){}
    return {status:r.status,body:j};
  }
  function applyData(d){
    state.days=(d&&d.days&&typeof d.days==='object')?d.days:{};
    state.settings={showPlayers:!!(d&&d.settings&&d.settings.showPlayers)};
  }
  function clearPin(){pin=null;isOwner=false;try{sessionStorage.removeItem('pin');}catch(e){}}
  async function load(){
    try{
      var data;
      if(isOwner&&pin){
        var r=await api({pin:pin,action:'load'});
        if(r.status!==200){clearPin();return load();}
        data=r.body;
      }else{
        var g=await fetch(API,{cache:'no-store'});
        if(!g.ok){throw new Error('status '+g.status);}
        data=await g.json();
      }
      applyData(data);
      loaded=true;loadError=false;
      if(!modalOpen){render();}
    }catch(e){
      if(!loaded){loadError=true;render();}
    }
  }
  function handleErr(status){
    if(status===401){clearPin();render();toast('รหัสไม่ถูกต้อง เข้าโหมดแก้ไขใหม่อีกครั้ง');return true;}
    if(status===429){toast('ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่');return false;}
    toast('บันทึกไม่สำเร็จ ลองอีกครั้ง');
    return false;
  }
  function stripPrivate(){
    Object.keys(state.days).forEach(function(dk){
      state.days[dk]=state.days[dk].map(function(s){
        return {id:s.id,start:s.start,end:s.end,type:s.type,ss:s.type==='block'?'':s.ss,campaign:s.type==='block'?'':s.campaign,
          players:state.settings.showPlayers&&s.type!=='block'?(s.players||[]):[]};
      });
    });
  }
  function exitAdmin(){
    clearPin();stripPrivate();animateNext='fade';render();load();
  }

  /* ---------- render ---------- */
  function render(){
    refreshNow();
    root.textContent='';
    var wrap=el('div','wrap'+(isOwner&&loaded?' wide':''));
    wrap.appendChild(header());
    if(!loaded){
      var nt=el('div','notice');
      if(loadError){
        nt.appendChild(el('div','','โหลดตารางไม่สำเร็จ'));
        nt.appendChild(btn('ลองอีกครั้ง','',function(){loadError=false;render();load();}));
      }else{
        nt.appendChild(el('div','','กำลังโหลดตาราง…'));
      }
      wrap.appendChild(nt);
      wrap.appendChild(footer());
      root.appendChild(wrap);
      return;
    }
    if(isOwner){wrap.appendChild(ownerBanner());}
    wrap.appendChild(toolbar());
    var layout=el('div','layout'+(isOwner?' with-aside':''));
    var main=el('div','main glass');
    main.appendChild(calendar());
    layout.appendChild(main);
    if(isOwner){layout.appendChild(summary());}
    wrap.appendChild(layout);
    wrap.appendChild(footer());
    root.appendChild(wrap);
    animateNext=null;
  }

  function freeDaysLeft(){
    var y=view.y,m=view.m,total=new Date(y,m+1,0).getDate(),n=0;
    for(var d=1;d<=total;d++){
      var dk=key(y,m,d);
      if(dk>=todayKey&&!(state.days[dk]&&state.days[dk].length)){n++;}
    }
    return n;
  }
  function header(){
    var head=el('header','head');
    head.appendChild(el('div','rays'));
    head.appendChild(el('div','eyebrow','Vaan Magica'));
    head.appendChild(el('h1','','ตารางเซสชัน'));
    var sub=el('p','sub','เช็กวันว่าง แล้วมาจองโต๊ะกันได้เลย');
    sub.appendChild(el('span','tail','✦'));
    head.appendChild(sub);
    if(loaded){
      var y=view.y,m=view.m,ended=key(y,m,new Date(y,m+1,0).getDate())<todayKey;
      if(!ended){
        var fs=el('div','free-strip');
        fs.appendChild(document.createTextNode('✧ '+MONTHS[m]+' ยังว่างอีก'));
        fs.appendChild(el('b','',String(freeDaysLeft())));
        fs.appendChild(document.createTextNode('วัน'));
        head.appendChild(fs);
      }
    }
    return head;
  }

  function ownerBanner(){
    var ob=el('div','owner-banner');
    var t=el('div','ob-t');
    t.appendChild(el('span','dot'));
    t.appendChild(el('span','','โหมดผู้ดูแล — คลิกที่วันเพื่อลงคิว บันทึกแล้วทุกคนเห็นทันที'));
    ob.appendChild(t);
    var acts=el('div','ob-acts');
    var sw=el('label','switch');
    var cb=document.createElement('input');
    cb.type='checkbox';cb.checked=!!state.settings.showPlayers;
    cb.addEventListener('change',async function(){
      var want=cb.checked;cb.disabled=true;
      try{
        var r=await api({pin:pin,action:'settings',showPlayers:want});
        if(r.status===200){
          state.settings={showPlayers:!!(r.body.settings&&r.body.settings.showPlayers)};
          toast(want?'ลูกค้าจะเห็น @discord ผู้เล่นแล้ว':'ซ่อน @discord ผู้เล่นจากลูกค้าแล้ว');
        }else{cb.checked=!want;if(handleErr(r.status)){return;}}
      }catch(e){cb.checked=!want;toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง');}
      cb.disabled=false;
    });
    sw.appendChild(cb);
    sw.appendChild(document.createTextNode('ให้ลูกค้าเห็น @discord ผู้เล่น'));
    acts.appendChild(sw);
    acts.appendChild(btn('ออกจากโหมดแก้ไข','',exitAdmin));
    ob.appendChild(acts);
    return ob;
  }

  function toolbar(){
    var bar=el('div','bar');
    var nav=el('div','nav');
    nav.appendChild(btn('‹','icon',function(){go(-1);},'เดือนก่อนหน้า'));
    var mt=el('div','mtitle',MONTHS[view.m]+' '+(view.y+543));
    mt.appendChild(el('span','ce','('+view.y+')'));
    nav.appendChild(mt);
    nav.appendChild(btn('›','icon',function(){go(1);},'เดือนถัดไป'));
    bar.appendChild(nav);
    bar.appendChild(btn('วันนี้','',goToday));
    var lg=el('div','legend');
    var lf=el('span','lf');lf.appendChild(document.createElement('i'));lf.appendChild(document.createTextNode('ว่าง'));
    lg.appendChild(lf);
    TYPES.forEach(function(t){

  /* ---------- admin summary ---------- */
  function monthStats(y,m){
    var total=new Date(y,m+1,0).getDate();
    var st={count:0,minutes:0,types:{campaign:0,mini:0,oneshot:0},camps:{},players:{},activeDays:0,freeAhead:0};
    for(var d=1;d<=total;d++){
      var dk=key(y,m,d);
      var list=sortList(state.days[dk]);
      var real=list.filter(function(s){return s.type!=='block';});
      if(real.length){st.activeDays++;}
      if(!list.length&&dk>=todayKey){st.freeAhead++;}
      real.forEach(function(s){
        var mins=dur(s);
        st.count++;st.minutes+=mins;
        st.types[s.type]=(st.types[s.type]||0)+1;
        var name=s.campaign||typeOf(s).label;
        var ck=name.toLowerCase();
        var c=st.camps[ck]||(st.camps[ck]={name:name,type:s.type,count:0,minutes:0,ss:[]});
        c.count++;c.minutes+=mins;c.type=s.type;
        if(s.ss){c.ss.push(ssLabel(s.ss));}
        (s.players||[]).forEach(function(p){st.players[p.toLowerCase()]=p;});
      });
    }
    return st;
  }
  function nextSession(){
    var keys=Object.keys(state.days).filter(function(k){return k>=todayKey;}).sort();
    for(var i=0;i<keys.length;i++){
      var list=sortList(state.days[keys[i]]);
      for(var j=0;j<list.length;j++){
        var s=list[j];
        if(s.type==='block'){continue;}
        if(keys[i]===todayKey&&toMin(s.start)+dur(s)<=nowMin){continue;}
        return {dk:keys[i],s:s};
      }
    }
    return null;
  }

  function openPin(){
    var ov=el('div','ov');

    ov.appendChild(md);

    var right=el('div','r');

    function close(){document.removeEventListener('keydown',onKey);ov.remove();}
    var busy=false;
    var cancel=btn('ยกเลิก','',close);
    var ok=btn('เข้าสู่โหมดแก้ไข','primary',submit);
    async function submit(){
      if(busy){return;}
      busy=true;ok.disabled=true;cancel.disabled=true;
      try{
        var r=await api({pin:input.value,action:'load'});
        if(r.status===200){
          pin=input.value;
          try{sessionStorage.setItem('pin',pin);}catch(e){}
          isOwner=true;applyData(r.body);loaded=true;loadError=false;
          close();animateNext='fade';render();
          FX.burst(window.innerWidth/2,Math.min(220,window.innerHeight/3),70);
          return;
        }else if(r.status===401){
          toast('รหัสไม่ถูกต้อง');input.value='';
        }else if(r.status===429){
          toast('ลองผิดหลายครั้งเกินไป รอสักครู่แล้วลองใหม่');
        }else{
          toast('ระบบยังไม่พร้อม ตรวจสอบการตั้งค่าบนเซิร์ฟเวอร์');
        }
      }catch(e){
        toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง');
      }
      busy=false;ok.disabled=false;cancel.disabled=false;input.focus();
    }
    right.appendChild(cancel);right.appendChild(ok);
    actions.appendChild(right);
    md.appendChild(actions);
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit();}});
    ov.addEventListener('click',function(e){if(e.target===ov){close();}});
    document.addEventListener('keydown',onKey);
    document.body.appendChild(ov);
    setTimeout(function(){input.focus();},0);
  }

  /* ---------- day editor ---------- */
  function campaignNames(){
    var count={},label={};
    Object.keys(state.days).forEach(function(dk){
      state.days[dk].forEach(function(s){
        if(!s.campaign||s.type==='block'){return;}
        var k=s.campaign.toLowerCase();
        count[k]=(count[k]||0)+1;label[k]=s.campaign;
      });
    });
    return Object.keys(count).sort(function(a,b){return count[b]-count[a];}).map(function(k){return label[k];}).slice(0,40);
  }
  function findLast(name,dk){
    var want=String(name||'').trim().toLowerCase();
    if(!want){return null;}
    var best=null,bestKey='';
    Object.keys(state.days).forEach(function(k){
      if(k>=dk){return;}
      sortList(state.days[k]).forEach(function(s){
        if(s.type==='block'||String(s.campaign||'').toLowerCase()!==want){return;}
        if(k>=bestKey){best=s;bestKey=k;}
      });
    });
    return best;
  }

    function addSession(type){
      var last=draft.length?draft[draft.length-1]:null;
      var s={id:newId(),start:'19:00',end:'23:00',type:type,ss:'',campaign:'',players:[],note:''};
      if(type==='block'){s.start='09:00';s.end='18:00';}
      else if(last&&TIME_RE.test(last.end)&&toMin(last.end)>toMin(last.start)&&toMin(last.end)<=1260){
        s.start=last.end;
        var e=toMin(last.end)+180;
        s.end=e>=1440?'00:00':pad(Math.floor(e/60))+':'+pad(e%60);
      }
      draft.push(s);
      renderList();
      var cards=listBox.querySelectorAll('.ed');

    function timeField(label,cls,value,onChange){
      var w=el('label','f '+cls);
      w.appendChild(el('span','',label));
      var box=el('div','tsel');
      var p=TIME_RE.test(value)?value.split(':'):['19','00'];

      hs.setAttribute('aria-label',label+' (ชั่วโมง)');ms.setAttribute('aria-label',label+' (นาที)');
      for(var h=0;h<24;h++){var o=document.createElement('option');o.value=pad(h);o.textContent=pad(h);hs.appendChild(o);}
      var mins=[];for(var mm=0;mm<60;mm+=5){mins.push(pad(mm));}
      if(mins.indexOf(p[1])<0){mins.push(p[1]);mins.sort();}
      mins.forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=v;ms.appendChild(o);});
      hs.value=p[0];ms.value=p[1];
      function ch(){onChange(hs.value+':'+ms.value);}
      hs.addEventListener('change',ch);ms.addEventListener('change',ch);
      box.appendChild(hs);box.appendChild(document.createTextNode(':'));box.appendChild(ms);
      w.appendChild(box);
      return {wrap:w,set:function(v){var q=v.split(':');if(!ms.querySelector('option[value="'+q[1]+'"]')){var o=document.createElement('option');o.value=q[1];o.textContent=q[1];ms.appendChild(o);}hs.value=q[0];ms.value=q[1];}};

      draft.forEach(function(s){
        if(err){return;}
        if(!TIME_RE.test(s.start)||!TIME_RE.test(s.end)){err='ใส่เวลาเริ่มและเวลาจบให้ครบทุกคิว';}
        else if(s.start===s.end){err='เวลาเริ่มกับเวลาจบต้องไม่เท่ากัน';}
      });
      if(!err){
        var v=draft.map(function(s){var a=toMin(s.start);return {s:s,a:a,b:a+dur(s)};}).sort(function(p,q){return p.a-q.a;});
        for(var i=0;i<v.length;i++){
          for(var j=i+1;j<v.length;j++){
            if(v[j].a<v[i].b){overlaps.push(v[i].s.start+'–'+v[i].s.end+' กับ '+v[j].s.start+'–'+v[j].s.end);}
          }
        }
      }
      warn.className='warn'+(err?' err':overlaps.length?' soft':'');
      warn.textContent=err||(overlaps.length?'เวลาทับกัน: '+overlaps.join(', ')+' (บันทึกได้ แต่ตรวจดูอีกที)':'');
      save.disabled=!!err;
      clearBtn.disabled=!draft.length;
      return !err;
    }

    function onKey(e){if(e.key==='Escape'&&!busyNow){close();}}
    function close(){
      document.removeEventListener('keydown',onKey);
      ov.remove();
      modalOpen=false;
      render();
    }
    document.addEventListener('keydown',onKey);

    var busyNow=false;
    async function doSave(){
      if(busyNow||!validate()){return;}
      busyNow=true;save.disabled=true;cancel.disabled=true;save.textContent='กำลังบันทึก…';
      var payload=draft.map(function(s){
        return {id:s.id,start:s.start,end:s.end,type:s.type,ss:String(s.ss||'').trim(),campaign:String(s.campaign||'').trim(),
          players:s.type==='block'?[]:s.players,note:String(s.note||'').trim()};
      });
      try{
        var r=await api({pin:pin,action:'save',date:dk,sessions:payload});
        if(r.status===200){
          var saved=Array.isArray(r.body.sessions)?r.body.sessions:payload;
          if(saved.length){state.days[dk]=saved;}else{delete state.days[dk];}
          close();
          var cellEl=root.querySelector('.day[data-date="'+dk+'"]');
          if(cellEl&&cellEl.getBoundingClientRect){
            var rc=cellEl.getBoundingClientRect();
            FX.burst(rc.left+rc.width/2,rc.top+rc.height/2,44);
          }
          toast('บันทึกแล้ว ✦ ทุกคนเห็นทันที');
          return;
        }
        if(r.status===401){busyNow=false;close();handleErr(401);return;}
        handleErr(r.status);
      }catch(e){
        toast('เชื่อมต่อไม่ได้ ลองอีกครั้ง');
      }
      busyNow=false;save.disabled=false;cancel.disabled=false;save.textContent='บันทึก';
      validate();
    }

    document.body.appendChild(ov);
    renderList();
    setTimeout(function(){
      var f=md.querySelector('.f-camp input')||md.querySelector('.adds button');
      if(f){f.focus();}
    },0);
  }

  /* ---------- start ---------- */
  render();
  load();
  setInterval(function(){if(!document.hidden&&!modalOpen){load();}},60000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!modalOpen&&loaded){load();}});
})();
</script>
</body>
</html>
